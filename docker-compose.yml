# CAS 双云工具 —— 一个文件搞定:直接拉 GHCR 预构建镜像,不用源码、不用本地构建
# 用法:
#   1. 把这一个文件放到群晖任意目录(如 /volume1/docker/cas-tool/),不用改任何内容
#   2. 群晖 Container Manager「项目」选这个文件启动,或 SSH: docker compose up -d
#   3. 打开 http://群晖IP:8099,到「设置」页填 OpenList 地址和 Token 即可
#   更新版本: docker compose pull && docker compose up -d
services:
  cas-tool:
    image: ghcr.io/quietmodem/cas-tool:latest
    container_name: cas-tool
    restart: unless-stopped
    ports:
      - "8099:8099"
    # 配置推荐在页面「设置」里填,存 ./data/settings.json,这个文件不用动。
    # 下面环境变量只是可选兜底(页面设置优先);访问口令忘了时,
    # 临时加一行 WEB_PASSWORD 就能救急登录,登进去再改口令。
    # environment:
    #   OPENLIST_URL: "http://192.168.111.2:5244"
    #   OPENLIST_TOKEN: ""
    #   CAS139_PHONE: ""
    #   CAS139_AUTH: ""
    #   WEB_PASSWORD: ""
    volumes:
      - ./data:/data    # 全部设置(地址/令牌/凭据/主目录)存在这里,容器重建不丢
